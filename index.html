
<!DOCTYPE html>
<html>
<head>
    <title>Welcome to Our Lady of Lourdes</title>

    <style>

body {
    margin: 0;
    min-height: 100vh;
    background-image: url("church.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: white;
    font-family: Arial, sans-serif;
}

/* Main chat area */
.chat-container {
    max-width: 700px;
    margin: 40px auto;
    padding: 25px;
}

/* Title */
h1 {
    text-align: center;
    color: white;
}

/* Greeting */
#greeting {
    text-align: center;
    color: white;
    font-size: 18px;
}

/* Quick buttons */
.quick-buttons {
    text-align: center;
    margin: 20px 0;
}

button {
    background: rgba(0, 0, 0, 0.65);
    color: white;
    border: 1px solid white;
    padding: 10px 15px;
    border-radius: 8px;
    margin: 5px;
    cursor: pointer;
}

button:hover {
    background: rgba(255, 255, 255, 0.2);
}

/* =========================
   PRAYER LIBRARY
========================= */

#prayer-library {
    text-align: center;
    margin-top: 20px;
}

#prayer-library h2 {
    color: white;
}

.prayer-category-title {
    font-size: 24px;
    margin-bottom: 15px;
}

/* Category buttons */

.prayer-category-button {
    display: inline-block;
    width: auto;
    margin: 5px;
    padding: 10px 15px;
    font-size: 15px;
}

/* Category menus */

#daily-prayer-menu,
#common-prayer-menu {
    text-align: center;
    margin-top: 20px;
}

#daily-prayer-menu h2,
#common-prayer-menu h2 {
    color: white;
}

/* =========================
   REAL BOOK
========================= */

#prayer-book-viewer {
    display: none;
    margin-top: 25px;
    text-align: center;
}

.book-wrapper {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
    perspective: 1800px;
}

/* Book itself */

.prayer-book {
    position: relative;
    width: 100%;
    height: 500px;
    min-height: 500px;
    transform-style: preserve-3d;
}

/* Book page */

.book-page {
    position: absolute;
    left: 3%;
    top: 0;
    width: 94%;
    height: 100%;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,0.12),
            transparent 8%,
            transparent 92%,
            rgba(0,0,0,0.10)
        ),
        #f5ead1;

    color: #30271d;

    border-radius: 5px 12px 12px 5px;

    box-shadow:
        0 8px 20px rgba(0,0,0,0.45),
        inset 8px 0 12px rgba(0,0,0,0.12),
        inset -5px 0 8px rgba(0,0,0,0.08);

    border-left: 3px solid rgba(90,60,30,0.35);

    transform-origin: left center;

    transform-style: preserve-3d;

    overflow: hidden;

    z-index: 5;

    touch-action: pan-y;
}

/* Page content */

.book-page-content {
    height: 100%;
    box-sizing: border-box;
    padding: 30px 35px;

    overflow-y: auto;

    text-align: left;

    white-space: pre-line;

    line-height: 1.7;

    font-size: 15px;
}

/* Page heading */

.book-page-title {
    text-align: center;
    font-size: 22px;
    font-weight: bold;

    margin-bottom: 20px;

    color: #392a1b;
}

/* Page number */

.book-page-number {
    text-align: center;
    margin-top: 8px;
    font-size: 13px;
    color: white;
}

/* Swipe hint */

.prayer-swipe-hint {
    display: none;
    font-size: 11px;
    opacity: 0.65;
    margin-top: 8px;
    letter-spacing: 0.3px;
}

/* Book spine effect */

.book-spine {
    position: absolute;
    left: 0;
    top: 0;
    width: 18px;
    height: 100%;

    background: rgba(70,45,25,0.45);

    z-index: 20;

    pointer-events: none;

    border-radius: 5px 0 0 5px;
}

/* Paper edges */

.book-page::after {
    content: "";
    position: absolute;

    right: 5px;
    top: 12px;
    bottom: 12px;

    width: 3px;

    background: repeating-linear-gradient(
        to bottom,
        rgba(90,60,30,0.18) 0px,
        rgba(90,60,30,0.18) 1px,
        transparent 1px,
        transparent 4px
    );

    pointer-events: none;
}

/* =========================
   PAGE TURN ANIMATION
========================= */

.book-page.turn-next {
    animation: turnNext 0.9s ease-in-out forwards;
}

@keyframes turnNext {

    0% {
        transform: rotateY(0deg);
        box-shadow:
            0 8px 20px rgba(0,0,0,0.45);
    }

    25% {
        transform: rotateY(-55deg);
        box-shadow:
            -15px 8px 25px rgba(0,0,0,0.35);
    }

    50% {
        transform: rotateY(-100deg);
        box-shadow:
            -25px 8px 30px rgba(0,0,0,0.25);
    }

    75% {
        transform: rotateY(-145deg);
        box-shadow:
            -15px 8px 25px rgba(0,0,0,0.18);
    }

    100% {
        transform: rotateY(-180deg);
        box-shadow:
            0 8px 20px rgba(0,0,0,0);
    }
}

.book-page.turn-previous {
    animation: turnPrevious 0.9s ease-in-out forwards;
}

@keyframes turnPrevious {

    0% {
        transform: rotateY(-180deg);
    }

    25% {
        transform: rotateY(-125deg);
    }

    50% {
        transform: rotateY(-80deg);
    }

    75% {
        transform: rotateY(-35deg);
    }

    100% {
        transform: rotateY(0deg);
    }
}

/* Page shadow during flip */

.book-page.flipping {
    pointer-events: none;
}

/* Book controls */

.book-controls {
    margin-top: 15px;
    text-align: center;
}

.book-controls button {
    min-width: 110px;
}

/* Book category button */

.book-back-button {
    margin-top: 10px;
}

/* =========================
   QUESTION AREA
========================= */

.question-area {
    display: flex;
    width: 100%;
    max-width: 700px;
    margin: 10px auto;
    gap: 8px;
    box-sizing: border-box;
}

/* Question input */

.question-area input {
    flex: 1;
    min-width: 0;
    box-sizing: border-box;

    background: rgba(0, 0, 0, 0.65);

    color: white;

    border: 1px solid white;

    padding: 12px;

    border-radius: 8px;

    font-size: 15px;
}

.question-area input::placeholder {
    color: white;
}

/* Ask button */

.question-area button {
    flex-shrink: 0;
}

/* =========================
   AI ANSWER BOX
========================= */

#answer-box {
    margin-top: 25px;

    background: rgba(0,0,0,0.70);

    border: 1px solid rgba(255,255,255,0.25);

    border-radius: 15px;

    padding: 20px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.4);
}

/* AI name */

.ai-title {
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 12px;
}

/* AI answer */

#answer {
    color: white;
    white-space: pre-line;
    line-height: 1.6;

    max-height: 350px;

    overflow-y: auto;
}

/* Vatican link */

.vatican-link {
    color: white;
    text-decoration: underline;
    font-weight: bold;
    cursor: pointer;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .chat-container {
        margin: 20px auto;
        padding: 15px;
    }

    h1 {
        font-size: 26px;
    }

    .question-area {
        width: 100%;
    }

    .question-area input {
        width: 100%;
    }

    .prayer-book {
        height: 520px;
        min-height: 520px;
    }

    .book-page-content {
        padding: 25px 22px;
        font-size: 14px;
        line-height: 1.6;
    }

    .book-page-title {
        font-size: 20px;
    }

}

/* =========================
   SWIPE MESSAGE
   TOUCH DEVICES ONLY
========================= */

@media (hover: none) and (pointer: coarse) {

    .prayer-swipe-hint {
        display: block;
    }

}

    </style>

</head>

<body>

<div class="chat-container">

    <h1>Welcome to Our Lady of Lourdes</h1>

    <p id="greeting">
        👋 Hello! Welcome. How can I help you?
    </p>


    <!-- =========================
         QUICK BUTTONS
    ========================= -->

    <div class="quick-buttons">

        <button onclick="showAnswer('mass')">
            Mass Times
        </button>

        <button onclick="showPrayerLibrary()">
            🙏 Prayer Library
        </button>

        <button onclick="showAnswer('gospel')">
            📖 Daily Gospel
        </button>

        <button onclick="showAnswer('calendar')">
            📅 Calendar
        </button>

    </div>


    <!-- =========================
         PRAYER LIBRARY
    ========================= -->

    <div id="prayer-library" style="display: none;">

        <h2>🙏 Prayer Library</h2>

        <button
            class="prayer-category-button"
            onclick="openPrayerCategory('daily')">
            📖 Daily Prayers
        </button>

        <button
            class="prayer-category-button"
            onclick="openPrayerCategory('common')">

        </button>

        <br>

        <button onclick="backToMainMenu()">

        </button>

    <!-- =========================
         DAILY PRAYER MENU
    ========================= -->

    <div id="daily-prayer-menu" style="display: none;">

        <h2>📖 Daily Prayers</h2>

        <button
            class="prayer-category-button"

            🌅 Morning Prayer
        </button>

        <button
            class="prayer-category-button"

        </button>

        <button
            class="prayer-category-button"
            onclick="openPrayerBook('daily', 2)">
            🌙 Prayer at Night
        </button>

        <br>

        <button onclick="backToPrayerCategories()">

    <!-- =========================

    ========================= -->

    <div id="common-prayer-menu" style="display: none;">

        </button>

        <button

        </button>

        <button
            class="prayer-category-button"
            onclick="openPrayerBook('common', 3)">
            ❤️ Act of Contrition
        </button>

        <button
            class="prayer-category-button"
            onclick="openPrayerBook('common', 4)">
            ✝️ Apostles Creed
        </button>

        <button
            class="prayer-category-button"
            onclick="openPrayerBook('common', 5)">

        </button>

        <button
            class="prayer-category-button"

        </button>

        <br>

        <button onclick="backToPrayerCategories()">

        </button>

    </div>


    <!-- =========================

    ========================= -->

    <div id="prayer-book-viewer">

        <div class="book-wrapper">

            <div class="prayer-book">

                <div class="book-spine"></div>

                <div id="book-page" class="book-page">

        </div>

        <div

        </div>

            Swipe to turn page
        </div>

        <div class="book-controls">

            <button onclick="previousPrayer()">
                ← Previous
            </button>

            <button onclick="nextPrayer()">
                Next →
            </button>

            <br>

            <button
                class="book-back-button"
                onclick="backToPrayerCategory()">
                ← Back
            </button>

        </div>

    </div>


    <!-- =========================
         QUESTION AREA
    ========================= -->

    <div class="question-area">

        <input
            type="text"
            id="question"
            placeholder="Type your question"
        >

        <button onclick="answerQuestion()">
            Ask
        </button>

    </div>


    <!-- =========================
         AI ANSWER BOX
    ========================= -->

    <div id="answer-box">

        <div class="ai-title">
            🤖 Parish Assistant
        </div>

        <div id="answer">
            Ask me something about the parish.
        </div>

    </div>

</div>


<script>

/* =========================
   AI TYPING EFFECT
========================= */

let typingInterval = null;
let typingTimeout = null;

function typeAnswer(answer) {

    let answerBox = document.getElementById("answer");

    if (typingInterval !== null) {
        clearInterval(typingInterval);
        typingInterval = null;
    }

    if (typingTimeout !== null) {
        clearTimeout(typingTimeout);
        typingTimeout = null;
    }

    answerBox.innerHTML = "🤖 AI is typing...";

    typingTimeout = setTimeout(function() {

        answerBox.textContent = "";

        let i = 0;

        let autoScroll = true;

        answerBox.onscroll = function() {

            let distanceFromBottom =
                answerBox.scrollHeight -
                answerBox.scrollTop -
                answerBox.clientHeight;

            if (distanceFromBottom > 20) {
                autoScroll = false;
            } else {
                autoScroll = true;
            }

        };

        typingInterval = setInterval(function() {

            answerBox.textContent += answer.charAt(i);

            i++;

            if (autoScroll) {
                answerBox.scrollTop =
                    answerBox.scrollHeight;
            }

            if (i >= answer.length) {

                clearInterval(typingInterval);
                typingInterval = null;

                if (answer.includes("VATICAN_LINK:")) {

                    let parts =
                        answer.split("VATICAN_LINK:");

                    let textBefore = parts[0];

                    let link = parts[1].trim();

                    answerBox.innerHTML =
                        textBefore.replace(/\n/g, "<br>") +
                        "<br><br>" +
                        "<a class='vatican-link' href='" +
                        link +
                        "' target='_blank'>" +
                        "🔗 Read the Full Reading on Vatican News" +
                        "</a>";

                    if (autoScroll) {
                        answerBox.scrollTop =
                            answerBox.scrollHeight;
                    }
                }

            }

        }, 25);

    }, 800);
}


/* =========================
   ASK QUESTION
========================= */

function answerQuestion() {

    let question =
        document.getElementById("question")
        .value
        .toLowerCase()
        .trim();

    let answer =
        "Sorry, I don't have an answer for that question.";


    /* GREETING */

    if (
        question === "hi" ||
        question === "hello" ||
        question === "hey" ||
        question.includes("good morning") ||
        question.includes("good afternoon") ||
        question.includes("good evening")
    ) {

        answer =
        "👋 Hello dear! Good day!.\n\n" +
        "How can I help you today?";
    }


    /* MASS */

    else if (
        question.includes("mass") ||
        question.includes("mass schedule") ||
        question.includes("mass timing") ||
        question.includes("what time is mass") ||
        question.includes("when is mass") ||
        question.includes("sunday mass") ||
        question.includes("mass hours hour") ||
        question.includes("mass timetable") ||
        question.includes("bulletin parish") ||
        question.includes("wekend masses") ||
        question.includes("av chapels") ||
        question.includes("chapels") ||
        question.includes("chapel") ||
        question.includes("av") ||
        question.includes("ctk") ||
        question.includes("tasek") ||
        question.includes("buntong") ||
        question.includes("jelapang") ||
        question.includes("sebastian") ||
        question.includes("municipal")
    ) {

        answer =
        "SUNDAY MASSES\n\n" +
        "7.00 am (Tamil)\n" +
        "9.00 am (English)\n" +
        "11.00 am (Bahasa - 4th Sunday)\n" +
        "6.00 pm (Tamil - In chapels)\n\n" +
        "Chapel of St. Sebastian, Municipal - 1st Sunday\n" +
        "Chapel of St. Francis of Assisi, Tasek - 2nd Sunday\n" +
        "Chapel of St. Annai Velanganny, Jelapang - 3rd Sunday\n" +
        "Chapel of Christ the King, Buntong Tiga - 4th Sunday\n\n" +
        "Weekdays Masses may change from time to time. " +
        "Please refer to the parish bulletin on the Parish News site.";
    }


    /* PARISH NEWS */

    else if (
        question.includes("parish news") ||
        question.includes("parish activities")
    ) {

        answer =
        "Please click below link\n\n" +
        "https://sites.google.com/d/1omjNmDoo0bs_V0dnaIGaYZ3L7RjohZ-I/p/1mcxGvd4Flnq2dhK7Yl3QN0XbwwrN86le/edit\n\n" +
        "Parish activities\n" +
        "Social engagement.";
    }


    /* CONTACT */

    else if (
        question.includes("contact") ||
        question.includes("phone") ||
        question.includes("number") ||
        question.includes("email")
    ) {

        answer =
        "You can contact the parish office during office hours\n\n" +
        "Tel 055279349\n\n" +
        "Email lourdes.ipoh@pgdiocese.org.";
    }


    /* LOCATION */

    else if (
        question.includes("address") ||
        question.includes("location")
    ) {

        answer =
        "Our parish is located in Ipoh\n\n" +
        "Address 45, Jalan Silibin, Taman Lim, 30100 Ipoh, Perak.";
    }


    /* PRIEST */

    else if (
        question.includes("parish priest") ||
        question.includes("priest") ||
        question.includes("fr") ||
        question.includes("current father")
    ) {

        answer =
        "Meet Our Current Parish Priests 🙏⛪\n\n" +
        "Parish priest : Rev Fr Robert Daniel\n" +
        "Asst Priest Rev Fr George.";
    }


    /* HISTORY */

    else if (
        question.includes("history") ||
        question.includes("church history") ||
        question.includes("sejarah") ||
        question.includes("olol history") ||
        question.includes("our lady of lourdes history")
    ) {

        answer =
        "I love to tell history, here we go ⛪\n\n" +
        "Our Lady of Lourdes, Ipoh, A Journey Through History\n\n" +
        "🌿 The Beginnings of Our Parish\n\n" +
        "The story of the Church of Our Lady of Lourdes, Ipoh, began during the early years of Ipoh's growth as a centre of the tin-mining industry.\n\n" +
        "In 1905, the parish was founded by Father Émile Marie Henri Sausseau of the Paris Foreign Missions Society. The mission was established primarily to serve the growing Indian railway workers and Tamil-speaking Catholic community who had settled in Ipoh during this period.\n\n" +
        "The first place of worship was a small wooden chapel with an attap roof, believed to have been built around 1901. As the Catholic community continued to grow, a larger wooden church was constructed in 1905 to accommodate the increasing number of faithful.\n\n" +
        "🏛️ The Present Church\n\n" +
        "The present Gothic-style brick church was completed in 1959, marking an important chapter in the parish's history. Its completion also commemorated the centenary of the Marian apparitions at Lourdes in 1858.\n\n" +
        "Among the church's distinctive features is its outdoor grotto, which recreates the Lourdes shrine and provides a peaceful place for prayer and devotion.\n\n" +
        "Another remarkable treasure is the church's unique stained-glass masterpiece created by Brother Joseph McNally, regarded as a one-of-a-kind work of its kind.\n\n" +
        "🙏 A Living Heritage\n\n" +
        "Today, the Church of Our Lady of Lourdes, Ipoh, stands not only as a place of worship but also as a living heritage of faith, community, and missionary history.\n\n" +
        "For more than a century, the parish has witnessed the growth and transformation of Ipoh while continuing to serve generations of Catholics. Its rich missionary heritage, beautiful architecture, treasured religious artefacts, and enduring Catholic community make it an important part of the Catholic heritage of Perak.\n\n" +
        "From its humble beginnings as a small wooden chapel to the beautiful church that stands today, the story of Our Lady of Lourdes, Ipoh, is a story of faith that continues to live on. 🙏⛪";
    }


    /* THE APOSTLES CREED */

    else if (
        question.includes("nicene creed") ||
        question.includes("i believe prayer") ||
        question.includes("i believe")
    ) {

        answer =
        "I believe in God the Father almighty,\n" +
        "Creator of heaven and earth.\n\n" +
        "And in Jesus Christ, His only Son, our Lord,\n" +
        "Who was conceived by the Holy Spirit,\n" +
        "born of the Virgin Mary,\n" +
        "suffered under Pontius Pilate,\n" +
        "was crucified, died, and was buried.\n" +
        "He descended into hell; the third day\n" +
        "He rose again from the dead;\n" +
        "He ascended into heaven, and sits at\n" +
        "the right hand of God the Father almighty,\n" +
        "from thence He shall come to judge\n" +
        "the living and the dead.\n\n" +
        "I believe in the Holy Spirit,\n" +
        "the holy Catholic Church,\n" +
        "the communion of saints,\n" +
        "the forgiveness of sins,\n" +
        "the resurrection of the body\n" +
        "and life everlasting.\n\n" +
        "Amen.";
    }


    /* OUR FATHER */

    else if (
        question.includes("our father") ||
        question.includes("lords prayer")
    ) {

        answer =
        "Our Father who art in heaven,\n" +
        "hallowed be thy name.\n" +
        "Thy kingdom come.\n" +
        "Thy will be done\n" +
        "on earth as it is in heaven.\n" +
        "Give us this day our daily bread,\n" +
        "and forgive us our trespasses,\n" +
        "as we forgive those who trespass against us,\n" +
        "and lead us not into temptation,\n" +
        "but deliver us from evil.\n" +
        "For thine is the kingdom and the power, and the glory,\n" +
        "forever and ever.\n\n" +
        "Amen.";
    }


    /* HAIL MARY */

    else if (
        question.includes("hail mary") ||
        question.includes("hail mary prayer") ||
        question.includes("latin hail mary")
    ) {

        answer =
        "🙏 Hail Mary\n\n" +
        "Hail Mary, full of grace,\n" +
        "The Lord is with thee.\n" +
        "Blessed art thou among women,\n" +
        "And blessed is the fruit of thy womb, Jesus.\n" +
        "Holy Mary, Mother of God,\n" +
        "Pray for us sinners,\n" +
        "Now and at the hour of our death.\n\n" +
        "Amen!\n\n" +
        "🙏 Hail Mary in Latin\n\n" +
        "Ave Maria, gratia plena,\n" +
        "Dominus tecum,\n" +
        "benedicta tu in mulieribus,\n" +
        "et benedictus fructus ventris tui Iesus.\n" +
        "Sancta Maria mater Dei,\n" +
        "ora pro nobis peccatoribus,\n" +
        "nunc, et in hora mortis nostrae.";
    }


    /* SAINT MICHAEL */

    else if (
        question.includes("saint michael") ||
        question.includes("saint michael prayer") ||
        question.includes("st michael") ||
        question.includes("st michael prayer") ||
        question.includes("st michael prayers")
    ) {

        answer =
        "🙏 Saint Michael the Archangel\n\n" +
        "Saint Michael the Archangel,\n" +
        "defend us in battle,\n" +
        "be our protection against the wickedness and snares of the devil;\n" +
        "may God rebuke him, we humbly pray;\n" +
        "and do thou, O Prince of the heavenly host,\n" +
        "by the power of God, cast into hell\n" +

/* =========================
   DISPLAY PAGE
========================= */

function displayPrayerPage() {

    let bookPage =
        document.getElementById("book-page");

    let pageContent =
        document.getElementById("book-page-content");

    let pageNumber =
        document.getElementById("book-page-number");

    let prayer =
        prayerCollections[currentPrayerCategory][currentPrayerIndex];


    pageContent.innerHTML =
        "<div class='book-page-title'>" +
        prayer.title +
        "</div>" +
        prayer.text;


    pageNumber.textContent =
        "Page " +
        (currentPrayerIndex + 1) +
        " of " +
        prayerCollections[currentPrayerCategory].length;


    bookPage.classList.remove("turn-next");

    bookPage.classList.remove("turn-previous");

    bookPage.classList.remove("flipping");


    pageContent.scrollTop = 0;

}


/* =========================
   NEXT PAGE
========================= */

function nextPrayer() {

    if (isPageTurning) {
        return;
    }

    let pages =
        prayerCollections[currentPrayerCategory];

    if (currentPrayerIndex >= pages.length - 1) {

        return;

    }


    isPageTurning = true;


    let bookPage =
        document.getElementById("book-page");


    bookPage.classList.remove("turn-next");

    bookPage.classList.remove("turn-previous");

    void bookPage.offsetWidth;


    bookPage.classList.add("flipping");

    bookPage.classList.add("turn-next");


    setTimeout(function() {

        currentPrayerIndex++;

        displayPrayerPage();

        isPageTurning = false;

    }, 850);

}


/* =========================
   PREVIOUS PAGE
========================= */

function previousPrayer() {

    if (isPageTurning) {
        return;
    }

    if (currentPrayerIndex <= 0) {

        return;

    }


    isPageTurning = true;

    currentPrayerIndex--;


    let bookPage =
        document.getElementById("book-page");


    bookPage.classList.remove("turn-next");

    bookPage.classList.remove("turn-previous");

    bookPage.classList.add("flipping");

    bookPage.classList.add("turn-next");


    setTimeout(function() {

        displayPrayerPage();

        bookPage.classList.remove("turn-next");

        bookPage.classList.add("turn-previous");

    }, 50);


    setTimeout(function() {

        bookPage.classList.remove("turn-previous");

        isPageTurning = false;

    }, 950);

}


/* =========================
   SWIPE GESTURE
========================= */

let swipeStartX = 0;
let swipeStartY = 0;

const bookPageElement =
    document.getElementById("book-page");


bookPageElement.addEventListener("touchstart", function(event) {

    if (event.touches.length !== 1) {
        return;
    }

    swipeStartX =
        event.touches[0].clientX;

    swipeStartY =
        event.touches[0].clientY;

}, { passive: true });


bookPageElement.addEventListener("touchend", function(event) {

    if (event.changedTouches.length !== 1) {
        return;
    }

    let swipeEndX =
        event.changedTouches[0].clientX;

    let swipeEndY =
        event.changedTouches[0].clientY;


    let differenceX =
        swipeEndX - swipeStartX;

    let differenceY =
        swipeEndY - swipeStartY;


    /* Ignore mostly vertical movement */

    if (Math.abs(differenceX) < 50) {
        return;
    }

    if (Math.abs(differenceX) < Math.abs(differenceY)) {
        return;
    }


    /* Swipe LEFT = NEXT */

    if (differenceX < 0) {

        nextPrayer();

    }


    /* Swipe RIGHT = PREVIOUS */

    else {

        previousPrayer();

    }

}, { passive: true });

            "John the Baptist remained faithful to God's truth even when it brought suffering. His example calls us to stand firmly for what is right and remain faithful to Christ.",

            prayer:
            "Lord Jesus, give me the courage of John the Baptist to stand for truth and what is right. Strengthen my faith when following You becomes difficult. Amen."
        }

    };


    typeAnswer(
        "📖 Loading today's Gospel..."
    );


    fetch(
        "https://cpbjr.github.io/catholic-readings-api/readings/" +
        year + "/" +
        month + "-" +
        day +
        ".json"
    )

    .then(response => response.json())

    .then(data => {

        let firstReading =
            data.readings.firstReading;

        let psalm =
            data.readings.psalm;

        let secondReading =
            data.readings.secondReading;

        let gospel =
            data.readings.gospel;


        let readingLink =
            "https://www.vaticannews.va/en/word-of-the-day/" +
            year + "/" +
            month + "/" +
            day +
            ".html";


        let todayMessage =
            dailyMessages[todayDate];


        if (!todayMessage) {

            todayMessage = {

                message:
                "Today's message will be updated soon.",

                prayer:
                "Lord Jesus, guide us and strengthen our faith each day. Amen."

            };

        }


        let fullAnswer =

            "📖 FIRST READING\n\n" +
            firstReading + "\n\n" +

            "🎵 RESPONSORIAL PSALM\n\n" +
            psalm + "\n\n" +

            (
                secondReading
                ?
                "📖 SECOND READING\n\n" +
                secondReading + "\n\n"
                :
                ""
            ) +

            "✝️ GOSPEL\n\n" +
            gospel + "\n\n" +

            "📝 TODAY'S MESSAGE\n\n" +
            todayMessage.message + "\n\n" +

            "🙏 TODAY'S PRAYER\n\n" +
            todayMessage.prayer + "\n\n" +

            "VATICAN_LINK:" +
            readingLink;


        typeAnswer(fullAnswer);

    })


    .catch(error => {

        console.log(
            "Gospel loading error:",
            error
        );

        typeAnswer(

            "📖 DAILY READINGS\n\n" +

            "Unable to load today's readings at the moment.\n\n" +

            "Please try again shortly."

        );

    });

}

</script>

</body>
